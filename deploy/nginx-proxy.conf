# Default: SSL dipasang di reverse proxy lain di depan VM ini (Nginx Proxy Manager, Traefik, HAProxy, dsb.),
# bukan di sini. Proxy depan WAJIB:
#   - melayani browser, agen, dan runner hanya lewat HTTPS dengan sertifikat yang dipercaya umum;
#   - meneruskan Host asli (beserta port bila bukan 443) dan X-Forwarded-For;
#   - tanpa batas ukuran body dan timeout ≥ 1 jam untuk /api/upload/, /api/runner/jobs/, /api/manual/files/.
# File ini diproses envsubst image nginx (/etc/nginx/templates): TLS_PROXY_IP diisi dari .env.
include /etc/nginx/lumbung/http-common.inc;

server {
    listen 80;
    # IP asli user diambil dari X-Forwarded-For hanya bila koneksi datang dari proxy depan. Tanpa ini semua
    # user terlihat ber-IP proxy dan berbagi satu kuota rate limit login.
    set_real_ip_from ${TLS_PROXY_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Browser, agen, dan runner selalu melihat https lewat proxy depan. Ditetapkan di sini, bukan diambil dari
    # header client, supaya tidak bisa dipalsukan. Akses langsung http://<VM> akan ditolak pemeriksaan Origin.
    set $lumbung_proto https;
    include /etc/nginx/lumbung/locations.inc;
}
