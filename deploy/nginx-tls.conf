# Produksi: SSL beli hanya dipasang di sini. Sertakan sertifikat perantara (full chain) di fullchain.pem.
# Saat SSL diperpanjang, sertifikat hanya diganti di proxy; agen dan runner tidak menyimpannya.
include /etc/nginx/lumbung/http-common.inc;

server {
    listen 80;
    server_tokens off;
    location = /api/watchdog { proxy_pass http://app; }
    location / { return 301 https://$http_host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/lumbung/locations.inc;
}
