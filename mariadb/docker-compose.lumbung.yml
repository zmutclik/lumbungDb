# Compose referensi zmutclik/mariadb, tag lumbungdb-*. Satu project per container. Di server database file ini
# disimpan sebagai docker-compose.yml di samping .env, lalu:
#   docker compose -p <project> up -d
services:
  mariadb:
    # Tanpa nilai bawaan: compose gagal bila IMAGE_TAG kosong, supaya versi MariaDB tidak naik diam-diam.
    image: zmutclik/mariadb:lumbungdb-${IMAGE_TAG:?isi IMAGE_TAG di .env, mis. 12.3-a1}
    container_name: ${CONTAINER_NAME:?isi CONTAINER_NAME}
    # Bukan HOSTNAME: variabel shell mengalahkan --env-file, sehingga semua container bisa mendapat nama mesin.
    hostname: ${CONTAINER_HOSTNAME:?isi CONTAINER_HOSTNAME}
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOTPASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_APPUSER}
      MARIADB_PASSWORD: ${DB_APPPASS}
      BACKUP_USER: ${BACKUP_USER}
      BACKUP_PASS: ${BACKUP_PASS}
      BACKUP_CRON: ${BACKUP_CRON:-}
      DUMP_CRON: ${DUMP_CRON:-}
      BINLOG_CRON: ${BINLOG_CRON:-}
      BINLOG_UNSENT_MAX_DAYS: ${BINLOG_UNSENT_MAX_DAYS:-3}
      LUMBUNG_URL: ${LUMBUNG_URL:-}
      LUMBUNG_TOKEN: ${LUMBUNG_TOKEN:-}
      LUMBUNG_AGE_RECIPIENTS: ${LUMBUNG_AGE_RECIPIENTS:-}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-60}
      STABLE_SECONDS: ${STABLE_SECONDS:-120}
      MAX_FILE_AGE_DAYS: ${MAX_FILE_AGE_DAYS:-0}
      DB_TUNING: ${DB_TUNING:-auto}
      DB_MEMORY: ${DB_MEMORY:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-200}
      DB_DISK: ${DB_DISK:-ssd}
      # Buat user healthcheck & jalankan mariadb-upgrade otomatis saat versi naik
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "${DATA_PORT:?isi DATA_PORT}:3306"
    volumes:
      - data:/var/lib/mysql
      - backup:/backup
      # Identitas server dibaca agen dari mesinnya; di dalam container /etc/hostname dikelola Docker.
      - /etc/hostname:/lumbung/server/hostname:ro
      - /etc/machine-id:/lumbung/server/machine-id:ro
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEM_LIMIT:-2G}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
  backup:
