{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block shell %}
<div class="center-page">
  <form class="card card-pad center-box" method="post" action="/login">
    <div class="logo login-logo"><img class="logo-mark" src="{{ static_url('img/logo-mark.svg') }}" alt="">Lumbung<span class="logo-db">DB</span></div>
    {% if error %}<div class="banner banner-bad" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <div class="field"><label for="username">Username</label>
      <input type="text" id="username" name="username" maxlength="100" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-pri" type="submit">Masuk</button>
  </form>
</div>
{% endblock %}
