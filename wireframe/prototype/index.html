<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumbungDB Prototype</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('lumbung-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=28">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a href="#/" class="logo"><span class="logo-mark">L</span>LumbungDB</a>
    <nav id="nav" aria-label="Menu utama"></nav>
    <div class="topbar-right">
      <span class="proto-chip" title="Semua data di halaman ini adalah contoh">Prototype · data contoh</span>
      <span class="refresh" id="refresh" title="Halaman menyegarkan diri tiap 60 detik"></span>
      <button class="theme-btn" id="theme-btn" data-act="theme" type="button">
        <svg class="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="user">admin</span>
    </div>
  </header>
  <div class="main">
    <div class="crumbs" id="crumbs"></div>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js?v=22"></script>
<script src="app.js?v=37"></script>
</body>
</html>
